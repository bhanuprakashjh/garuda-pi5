<title>SLAM Trajectory Review — Garuda Bench</title>
<style>
  :root{
    --bg:#f3f5f7; --panel:#ffffff; --panel-2:#f7f9fb; --line:#dde3e9;
    --ink:#182430; --ink-2:#4a5a6a; --muted:#7c8b99;
    --accent:#0e8f9c; --accent-ink:#0a6a74;
    --gt:#5a6b7a; --grid:rgba(24,36,48,.10);
    --c-lo:#12a97a; --c-mid:#d99418; --c-hi:#d64328;
    --shadow:0 1px 2px rgba(16,32,48,.06),0 8px 24px rgba(16,32,48,.06);
    --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0b0f14; --panel:#121a22; --panel-2:#0f161d; --line:#202c37;
      --ink:#d3dde6; --ink-2:#9db0c0; --muted:#6c7e8d;
      --accent:#3fc0cc; --accent-ink:#7fdbe4;
      --gt:#8496a5; --grid:rgba(180,200,215,.09);
      --c-lo:#33d59c; --c-mid:#e6b23a; --c-hi:#e5533c;
      --shadow:0 1px 0 rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="light"]{
    --bg:#f3f5f7; --panel:#ffffff; --panel-2:#f7f9fb; --line:#dde3e9;
    --ink:#182430; --ink-2:#4a5a6a; --muted:#7c8b99;
    --accent:#0e8f9c; --accent-ink:#0a6a74; --gt:#5a6b7a; --grid:rgba(24,36,48,.10);
    --c-lo:#12a97a; --c-mid:#d99418; --c-hi:#d64328;
    --shadow:0 1px 2px rgba(16,32,48,.06),0 8px 24px rgba(16,32,48,.06);
  }
  :root[data-theme="dark"]{
    --bg:#0b0f14; --panel:#121a22; --panel-2:#0f161d; --line:#202c37;
    --ink:#d3dde6; --ink-2:#9db0c0; --muted:#6c7e8d;
    --accent:#3fc0cc; --accent-ink:#7fdbe4; --gt:#8496a5; --grid:rgba(180,200,215,.09);
    --c-lo:#33d59c; --c-mid:#e6b23a; --c-hi:#e5533c;
    --shadow:0 1px 0 rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;line-height:1.5}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 22px 56px}

  /* header */
  header{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 16px;
    padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:22px}
  .brand{font-family:var(--mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--accent-ink);font-weight:600}
  h1{font-size:clamp(22px,3.4vw,30px);margin:2px 0 0;font-weight:650;letter-spacing:-.01em;
    text-wrap:balance;flex:1 1 auto}
  .prov{font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.02em}

  /* tabs */
  .tabs{display:flex;gap:8px;margin:0 0 18px;flex-wrap:wrap}
  .tab{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink-2);
    font-family:var(--mono);font-size:13px;padding:9px 15px;border-radius:9px;cursor:pointer;
    display:flex;align-items:center;gap:9px;transition:border-color .15s,color .15s,background .15s}
  .tab:hover{border-color:var(--accent)}
  .tab .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
  .tab[aria-selected="true"]{border-color:var(--accent);color:var(--ink);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel))}
  .tab[aria-selected="true"] .dot{background:var(--accent)}
  .tab .sub{color:var(--muted);font-size:11px}
  .tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* main grid */
  .grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(260px,.95fr);gap:16px}
  @media (max-width:820px){.grid{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}

  /* viewer */
  .viewer{position:relative;overflow:hidden;height:clamp(440px,58vh,640px)}
  #plot{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
  #plot.drag{cursor:grabbing}
  .vhead{position:absolute;top:12px;left:14px;right:14px;display:flex;justify-content:space-between;
    align-items:flex-start;gap:10px;pointer-events:none}
  .vtitle{font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--ink-2);
    background:color-mix(in srgb,var(--panel) 78%,transparent);padding:5px 9px;border-radius:7px;
    border:1px solid var(--line);backdrop-filter:blur(4px)}
  .vlegend{background:color-mix(in srgb,var(--panel) 78%,transparent);border:1px solid var(--line);
    border-radius:7px;padding:6px 9px;backdrop-filter:blur(4px);pointer-events:none}
  .vlegend .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);display:flex;justify-content:space-between;margin-bottom:4px}
  .bar{width:130px;height:8px;border-radius:4px;
    background:linear-gradient(90deg,var(--c-lo),var(--c-mid),var(--c-hi))}
  .ticks{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;
    color:var(--muted);margin-top:2px}
  .vfoot{position:absolute;left:14px;bottom:12px;right:14px;display:flex;gap:8px;align-items:center;
    flex-wrap:wrap}
  .ctl{appearance:none;font-family:var(--mono);font-size:11.5px;color:var(--ink-2);cursor:pointer;
    background:color-mix(in srgb,var(--panel) 82%,transparent);border:1px solid var(--line);
    border-radius:7px;padding:6px 10px;backdrop-filter:blur(4px);display:inline-flex;gap:7px;align-items:center}
  .ctl:hover{border-color:var(--accent);color:var(--ink)}
  .ctl:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .ctl .k{width:7px;height:7px;border-radius:2px}
  .hint{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-left:auto}
  .legwrap{display:flex;flex-direction:column;align-items:flex-end}

  /* readout */
  .readout{padding:18px 18px 16px;display:flex;flex-direction:column;gap:16px}
  .hero{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--panel-2)}
  .hero .k{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted)}
  .hero .v{font-family:var(--mono);font-weight:650;font-variant-numeric:tabular-nums;
    font-size:clamp(34px,7vw,46px);line-height:1;letter-spacing:-.02em;margin-top:6px;color:var(--ink)}
  .hero .v small{font-size:.42em;font-weight:500;color:var(--ink-2);margin-left:4px;letter-spacing:0}
  .hero .cap{font-size:12px;color:var(--ink-2);margin-top:7px}
  .cells{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .cell{border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:var(--panel)}
  .cell .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .cell .v{font-family:var(--mono);font-size:19px;font-variant-numeric:tabular-nums;margin-top:5px;
    letter-spacing:-.01em}
  .cell .v small{font-size:12px;color:var(--ink-2);font-weight:400}
  .cammod{display:flex;gap:10px;align-items:flex-start;border-top:1px solid var(--line);padding-top:13px}
  .cammod .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);flex:0 0 46px;padding-top:2px}
  .cammod .val{font-size:13px;color:var(--ink)}
  .cammod .val .sub{color:var(--muted);font-size:12px}

  /* filmstrip */
  .strip{margin-top:16px;padding:16px}
  .striphead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:11px}
  .striphead .t{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-2)}
  .striphead .s{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .film{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
  @media (max-width:560px){.film{grid-template-columns:repeat(2,1fr)}}
  .frame{position:relative;border:1px solid var(--line);border-radius:9px;overflow:hidden;
    background:#000;aspect-ratio:4/3;transition:border-color .15s,transform .15s}
  .frame img{width:100%;height:100%;object-fit:cover;display:block;filter:contrast(1.04)}
  .frame.on{border-color:var(--accent);transform:translateY(-2px)}
  .frame .n{position:absolute;left:6px;bottom:5px;font-family:var(--mono);font-size:9px;color:#dfe8ef;
    background:rgba(0,0,0,.5);padding:1px 5px;border-radius:4px}

  /* method */
  .method{margin-top:20px;font-size:12px;color:var(--muted);line-height:1.65;
    border-top:1px solid var(--line);padding-top:16px}
  .method b{color:var(--ink-2);font-weight:600}
  .method code{font-family:var(--mono);font-size:11.5px;color:var(--accent-ink);
    background:color-mix(in srgb,var(--accent) 10%,transparent);padding:1px 5px;border-radius:4px}
  @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>

<div class="wrap">
  <header>
    <div style="flex:1 1 auto;min-width:240px">
      <div class="brand">Garuda SDK · Bench</div>

  <div class="method" id="method"></div>
</div>

const KEYS = ["euroc","tumvi"];
let cur = "euroc";
let showGT = true;
const ERR_CEIL = 15; // cm — shared colour ceiling across datasets

/* ---------- colour map (green -> amber -> red), reads live CSS vars ---------- */
function cssv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function hex2rgb(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function lerp(a,b,t){return a+(b-a)*t;}
function cmap(t){
  t=Math.max(0,Math.min(1,t));
  const lo=hex2rgb(cssv('--c-lo')),mid=hex2rgb(cssv('--c-mid')),hi=hex2rgb(cssv('--c-hi'));
  let c1,c2,u;
  if(t<0.5){c1=lo;c2=mid;u=t/0.5;}else{c1=mid;c2=hi;u=(t-0.5)/0.5;}
  return `rgb(${lerp(c1[0],c2[0],u)|0},${lerp(c1[1],c2[1],u)|0},${lerp(c1[2],c2[2],u)|0})`;
}

/* ---------- 3D orbit view ---------- */
const cv=document.getElementById('plot'), ctx=cv.getContext('2d');
let yaw=0.62, pitch=-0.52, zoom=1;
let center=[0,0,0], radius=1;
let anim={on:false,p:0,raf:0};
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;

function fitBounds(){
  const d=DATA[cur];
  const pts=d.gt.concat(d.est);
  const mn=[1e9,1e9,1e9],mx=[-1e9,-1e9,-1e9];
  for(const p of pts)for(let i=0;i<3;i++){mn[i]=Math.min(mn[i],p[i]);mx[i]=Math.max(mx[i],p[i]);}
  center=[(mn[0]+mx[0])/2,(mn[1]+mx[1])/2,(mn[2]+mx[2])/2];
  radius=0;
  for(const p of pts){const dx=p[0]-center[0],dy=p[1]-center[1],dz=p[2]-center[2];
    radius=Math.max(radius,Math.hypot(dx,dy,dz));}
  radius=radius||1;
}
function rot(p){
  const x=p[0]-center[0], y=p[1]-center[1], z=p[2]-center[2];
  const cy=Math.cos(yaw),sy=Math.sin(yaw);
  let rx=x*cy - y*sy, ry=x*sy + y*cy, rz=z;
  const cp=Math.cos(pitch),sp=Math.sin(pitch);
  let ry2=ry*cp - rz*sp, rz2=ry*sp + rz*cp;
  return [rx,ry2,rz2];
}
function project(p,w,h){
  const r=rot(p);
  const s=Math.min(w,h)*0.40*zoom/radius;
  return [w/2 + r[0]*s, h/2 - r[2]*s, r[1]];
}
function resize(){
  const dpr=Math.min(2,window.devicePixelRatio||1);
  const r=cv.getBoundingClientRect();
  cv.width=Math.max(1,r.width*dpr); cv.height=Math.max(1,r.height*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  draw();
}
function draw(){
  const d=DATA[cur];
  const w=cv.clientWidth, h=cv.clientHeight;
  ctx.clearRect(0,0,w,h);

  // ground grid on z=min plane
  ctx.strokeStyle=cssv('--grid'); ctx.lineWidth=1;
  const zmin=-radius; const g=4;
  for(let i=-g;i<=g;i++){
    const a=i/g*radius;
    line3(w,h,[center[0]+a,center[1]-radius,center[2]+zmin],[center[0]+a,center[1]+radius,center[2]+zmin]);
    line3(w,h,[center[0]-radius,center[1]+a,center[2]+zmin],[center[0]+radius,center[1]+a,center[2]+zmin]);
  }

  // groundtruth (dashed reference)
  if(showGT){
    ctx.strokeStyle=cssv('--gt'); ctx.lineWidth=1.6; ctx.setLineDash([5,5]);
    ctx.globalAlpha=.9; polyline(d.gt,w,h); ctx.setLineDash([]); ctx.globalAlpha=1;
  }

  // estimated (coloured by error)
  ctx.lineWidth=2.4; ctx.lineJoin='round'; ctx.lineCap='round';
  const e=d.est, er=d.err;
  const upto = anim.on ? Math.max(2,(anim.p*e.length)|0) : e.length;
  for(let i=1;i<upto;i++){
    const a=project(e[i-1],w,h), b=project(e[i],w,h);
    ctx.strokeStyle=cmap((er[i]||0)/ERR_CEIL);
    ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
  }

  // start / end / playhead markers
  marker(e[0],w,h,cssv('--accent'),4.5,'start');
  if(anim.on){
    const idx=Math.min(e.length-1,(anim.p*e.length)|0);
    marker(e[idx],w,h,cssv('--ink'),5,null);
  }else{
    marker(e[e.length-1],w,h,cssv('--c-hi'),4.5,'end');
  }
}
function line3(w,h,p,q){const a=project(p,w,h),b=project(q,w,h);
  ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();}
function polyline(arr,w,h){ctx.beginPath();
  for(let i=0;i<arr.length;i++){const s=project(arr[i],w,h);i?ctx.lineTo(s[0],s[1]):ctx.moveTo(s[0],s[1]);}
  ctx.stroke();}
function marker(p,w,h,col,r,label){
  const s=project(p,w,h);
  ctx.fillStyle=col; ctx.beginPath(); ctx.arc(s[0],s[1],r,0,7); ctx.fill();
  ctx.strokeStyle=cssv('--panel'); ctx.lineWidth=1.5; ctx.stroke();
  if(label){ctx.fillStyle=cssv('--muted');ctx.font='10px '+cssv('--mono');
    ctx.fillText(label,s[0]+7,s[1]-6);}
}

/* ---------- interaction ---------- */
let drag=null;
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId);
  cv.classList.add('drag');stopAnim();});
cv.addEventListener('pointermove',e=>{if(!drag)return;
  yaw+=(e.clientX-drag.x)*0.008; pitch+=(e.clientY-drag.y)*0.008;
  pitch=Math.max(-1.5,Math.min(1.5,pitch)); drag={x:e.clientX,y:e.clientY}; draw();});
cv.addEventListener('pointerup',e=>{drag=null;cv.classList.remove('drag');});
cv.addEventListener('pointercancel',()=>{drag=null;cv.classList.remove('drag');});
cv.addEventListener('wheel',e=>{e.preventDefault();zoom*=e.deltaY<0?1.1:0.9;
  zoom=Math.max(0.3,Math.min(6,zoom));draw();},{passive:false});

/* ---------- playback sweep ---------- */
function stepAnim(){
  anim.p+=0.0045; if(anim.p>=1){anim.p=1;draw();stopAnim();return;}
  draw(); syncFilm(); anim.raf=requestAnimationFrame(stepAnim);
}
function startAnim(){if(reduce){return;}anim.on=true;anim.p=0;
  document.getElementById('playlbl').textContent='Pause';anim.raf=requestAnimationFrame(stepAnim);}
function stopAnim(){anim.on=false;cancelAnimationFrame(anim.raf);
  document.getElementById('playlbl').textContent='Play';draw();syncFilm();}
document.getElementById('play').onclick=()=>{anim.on?stopAnim():startAnim();};
document.getElementById('togglegt').onclick=e=>{showGT=!showGT;
  e.currentTarget.style.opacity=showGT?1:.5;draw();};
document.getElementById('reset').onclick=()=>{yaw=0.62;pitch=-0.52;zoom=1;draw();};

/* ---------- idle auto-rotate (skipped for reduced motion) ---------- */
let idle=0;
function tick(){
  if(!drag&&!anim.on&&!reduce){idle++; if(idle>90){yaw+=0.0016;draw();}}
  requestAnimationFrame(tick);
}
['pointerdown','wheel','pointermove'].forEach(ev=>cv.addEventListener(ev,()=>idle=0));

/* ---------- panels ---------- */
function fmt(n,d=2){return Number(n).toFixed(d);}
function render(){
  const d=DATA[cur], s=d.stats;
  document.getElementById('vtitle').textContent=d.name+'  ·  '+d.camera.split('·')[0].trim();
  document.getElementById('ate').innerHTML=fmt(s.ate_rmse_cm)+'<small>cm</small>';
  document.getElementById('atecap').textContent=
    'SE(3)-aligned to groundtruth · '+s.matched.toLocaleString()+' / '+s.poses.toLocaleString()+' poses associated';
  const cells=[
    ['Mean error',fmt(s.ate_mean_cm)+'<small> cm</small>'],
    ['Max error',fmt(s.ate_max_cm)+'<small> cm</small>'],
    ['Front-end rate',d.fps+'<small> fps</small>'],
    ['Keyframes',d.kfs],
    ['Frames tracked',d.stats.poses.toLocaleString()],
    ['Path length',fmt(s.pathlen_m,1)+'<small> m</small>'],
  ];
  document.getElementById('cells').innerHTML=cells.map(c=>
    `<div class="cell"><div class="k">${c[0]}</div><div class="v">${c[1]}</div></div>`).join('');
  document.getElementById('cam').innerHTML=
    `${d.camera}<div class="sub">${d.subtitle} · ${d.fps_note}</div>`;
  // film
  document.getElementById('stripsub').textContent=d.frames.length+' frames sampled across the run';
  document.getElementById('film').innerHTML=d.frames.map((f,i)=>
    `<div class="frame" data-i="${i}"><img src="${f}" alt="cam0 frame ${i+1}"><span class="n">${i+1}</span></div>`).join('');
  fitBounds(); resize();
}
function syncFilm(){
  const frames=document.querySelectorAll('.frame');
  if(!frames.length)return;
  const active = anim.on ? Math.min(frames.length-1,(anim.p*frames.length)|0) : -1;
  frames.forEach((el,i)=>el.classList.toggle('on',i===active));
}

/* ---------- tabs ---------- */
function buildTabs(){
  const t=document.getElementById('tabs');
  t.innerHTML=KEYS.map(k=>{const d=DATA[k];
    return `<button class="tab" role="tab" data-k="${k}" aria-selected="${k===cur}">`+
      `<span class="dot"></span><span>${d.name}</span><span class="sub">${d.tag}</span></button>`;
  }).join('');
  t.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
    cur=b.dataset.k; stopAnim();
    t.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x.dataset.k===cur));
    render();
  });
}

document.getElementById('prov').textContent='Raspberry Pi 5 + Hailo-10H · ORB-SLAM3 stereo (headless, no IMU) · measured 2026-08-03';
document.getElementById('method').innerHTML=
  '<b>Method.</b> ORB-SLAM3 stereo runs headless in an aarch64 Ubuntu-22.04 container on the Pi 5 '+
  '(passive heatsink, thermally throttled). Estimated trajectory is SE(3)-aligned to groundtruth '+
  '(<code>Umeyama, no scale</code> — stereo is metric), poses associated within <code>20 ms</code>. '+
  'Line colour encodes per-pose position error against the reference. '+
  '<b>EuRoC MH_01</b> uses Vicon groundtruth; <b>TUM-VI room1</b> uses motion-capture groundtruth (fisheye, no IMU). '+
  'Every figure is measured on this bench — no estimates (CLAUDE.md §6.1).';

buildTabs(); render(); tick();
new ResizeObserver(resize).observe(cv);
matchMedia('(prefers-color-scheme:dark)').addEventListener?.('change',draw);
</script>
