  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;line-height:1.5}
  .wrap{max-width:1180px;margin:0 auto;padding:26px 20px 52px}
  header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:20px}
  .brand{font-family:var(--mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent-ink);font-weight:600}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}

  #cv.drag{cursor:grabbing}
  .overlay{position:absolute;left:0;right:0;pointer-events:none}
  .top{top:12px;display:flex;justify-content:space-between;padding:0 14px;gap:10px;align-items:flex-start}
  .tag{font-family:var(--mono);font-size:11px;letter-spacing:.03em;color:var(--ink-2);background:color-mix(in srgb,var(--panel) 76%,transparent);border:1px solid var(--line);border-radius:7px;padding:5px 9px;backdrop-filter:blur(5px)}
  .bot{bottom:12px;display:flex;gap:8px;padding:0 14px;align-items:center;flex-wrap:wrap}
  .ctl{pointer-events:auto;appearance:none;font-family:var(--mono);font-size:11.5px;color:var(--ink-2);cursor:pointer;background:color-mix(in srgb,var(--panel) 82%,transparent);border:1px solid var(--line);border-radius:7px;padding:6px 10px;backdrop-filter:blur(5px);display:inline-flex;gap:7px;align-items:center}
  .ctl:hover{border-color:var(--accent);color:var(--ink)}
  .ctl:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .ctl .sw{width:8px;height:8px;border-radius:2px}
  .hint{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-left:auto;pointer-events:none}
  input[type=range]{pointer-events:auto;accent-color:var(--accent);width:74px}
  .legend{pointer-events:none;display:flex;flex-direction:column;gap:3px;align-items:flex-end}
  .lbar{width:120px;height:7px;border-radius:4px}
  .lbl{font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:var(--muted);display:flex;justify-content:space-between;width:120px}
  .readout{padding:16px;display:flex;flex-direction:column;gap:13px}
  .hero{border:1px solid var(--line);border-radius:12px;padding:13px 15px;background:var(--panel-2)}
  .hero .k{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
  .hero .v{font-family:var(--mono);font-weight:650;font-variant-numeric:tabular-nums;font-size:clamp(30px,6vw,40px);line-height:1;letter-spacing:-.02em;margin-top:6px}
  .hero .v small{font-size:.4em;font-weight:500;color:var(--ink-2);margin-left:3px}
  .hero .cap{font-size:12px;color:var(--ink-2);margin-top:6px}
  .cells{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .cell{border:1px solid var(--line);border-radius:10px;padding:9px 11px}
  .cell .k{font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
  .cell .v{font-family:var(--mono);font-size:18px;font-variant-numeric:tabular-nums;margin-top:4px}
  .cell .v small{font-size:11px;color:var(--ink-2)}
  .note{font-size:12px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:11px;line-height:1.55}
  .note b{color:var(--ink)}
  .method{margin-top:18px;font-size:12px;color:var(--muted);line-height:1.65;border-top:1px solid var(--line);padding-top:14px}
  .method code{font-family:var(--mono);font-size:11.5px;color:var(--accent-ink);background:color-mix(in srgb,var(--accent) 10%,transparent);padding:1px 5px;border-radius:4px}

</style>

const S = DATA.stats;
const NB = 24;
// typed arrays
const N = DATA.points.length;
const px = new Float32Array(N), py = new Float32Array(N), pz = new Float32Array(N), pg = new Uint8Array(N);
for (let i=0;i<N;i++){const p=DATA.points[i];px[i]=p[0];py[i]=p[1];pz[i]=p[2];pg[i]=p[3];}
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let yaw=0.7, pitch=-0.35, zoom=1, mode='intensity', showTraj=true, ps=1.8;
let center=[0,0,0], radius=1, drag=null, idle=0;
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
function cssv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}

function fit(){
  const mn=[1e9,1e9,1e9],mx=[-1e9,-1e9,-1e9];
  for(let i=0;i<N;i++){const v=[px[i],py[i],pz[i]];for(let k=0;k<3;k++){if(v[k]<mn[k])mn[k]=v[k];if(v[k]>mx[k])mx[k]=v[k];}}
  center=[(mn[0]+mx[0])/2,(mn[1]+mx[1])/2,(mn[2]+mx[2])/2]; radius=0;
  for(let i=0;i<N;i++){const dx=px[i]-center[0],dy=py[i]-center[1],dz=pz[i]-center[2];const r=Math.hypot(dx,dy,dz);if(r>radius)radius=r;}
  radius=radius||1;
}
// ---- palettes ----
function lerp(a,b,t){return a+(b-a)*t;}
function turbo(t){ // 5-stop approximation
  const st=[[58,80,182],[53,197,201],[122,214,66],[230,192,32],[229,83,60]];
  t=Math.max(0,Math.min(1,t))*4; const i=Math.floor(t), f=t-i, a=st[i], b=st[Math.min(4,i+1)];
  return `rgb(${lerp(a[0],b[0],f)|0},${lerp(a[1],b[1],f)|0},${lerp(a[2],b[2],f)|0})`;
}
let palette=[], binLists=[];
function buildBins(){
  palette=[];
  for(let b=0;b<NB;b++){const t=b/(NB-1);
    if(mode==='depth'){palette.push(turbo(t));}
    else{const v=lerp(12,252,t)|0;palette.push(`rgb(${v},${v},${v})`);}}  // true grayscale = real image
  binLists=Array.from({length:NB},()=>[]);
  let lo=1e9,hi=-1e9;
  if(mode==='depth'){for(let i=0;i<N;i++){if(pz[i]<lo)lo=pz[i];if(pz[i]>hi)hi=pz[i];}}
  for(let i=0;i<N;i++){
    let t = mode==='depth' ? (pz[i]-lo)/(hi-lo+1e-9) : pg[i]/255;
    let b=Math.max(0,Math.min(NB-1,Math.floor(t*NB)));
    binLists[b].push(i);
  }
  document.getElementById('legBar').style.background = mode==='depth'
    ? 'linear-gradient(90deg,rgb(58,80,182),rgb(53,197,201),rgb(122,214,66),rgb(230,192,32),rgb(229,83,60))'
    : 'linear-gradient(90deg,#0a0a0a,#f2f2f2)';
  document.getElementById('legText').innerHTML = mode==='depth'
    ? '<span>near</span><span>far</span>' : '<span>image brightness</span>';
}
// ---- projection ----
let sc=1, W=0, H=0;
function setSc(){W=cv.clientWidth;H=cv.clientHeight;sc=Math.min(W,H)*0.42*zoom/radius;}
function proj(x,y,z){
  x-=center[0];y-=center[1];z-=center[2];
  const cy=Math.cos(yaw),sy=Math.sin(yaw); let rx=x*cy-z*sy, rz=x*sy+z*cy;
  const cp=Math.cos(pitch),sp=Math.sin(pitch); let ry=y*cp-rz*sp, rz2=y*sp+rz*cp;
  return [W/2+rx*sc, H/2-ry*sc];
}
function resize(){const dpr=Math.min(2,devicePixelRatio||1);const r=cv.getBoundingClientRect();cv.width=Math.max(1,r.width*dpr);cv.height=Math.max(1,r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);draw();}
function draw(){
  setSc();
  ctx.clearRect(0,0,W,H);
  const step = drag?2:1, s=ps;
  for(let b=0;b<NB;b++){
    const arr=binLists[b]; if(!arr.length)continue;
    ctx.fillStyle=palette[b];
    for(let k=0;k<arr.length;k+=step){const i=arr[k];
      const p=proj(px[i],py[i],pz[i]); ctx.fillRect(p[0],p[1],s,s);}
  }
  if(showTraj && DATA.traj.length>1){
    ctx.strokeStyle=cssv('--traj');ctx.lineWidth=2.2;ctx.lineJoin='round';
    ctx.beginPath();
    for(let i=0;i<DATA.traj.length;i++){const t=DATA.traj[i];const p=proj(t[0],t[1],t[2]);i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);}
    ctx.stroke();
    ctx.fillStyle=cssv('--kf');
    for(const t of DATA.kf){const p=proj(t[0],t[1],t[2]);ctx.beginPath();ctx.arc(p[0],p[1],3,0,7);ctx.fill();}
    // start marker
    const s0=proj(DATA.traj[0][0],DATA.traj[0][1],DATA.traj[0][2]);
    ctx.fillStyle=cssv('--accent');ctx.beginPath();ctx.arc(s0[0],s0[1],4.5,0,7);ctx.fill();
  }
}
// ---- interaction ----
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId);cv.classList.add('drag');idle=0;});
cv.addEventListener('pointermove',e=>{if(!drag)return;yaw+=(e.clientX-drag.x)*0.008;pitch+=(e.clientY-drag.y)*0.008;pitch=Math.max(-1.5,Math.min(1.5,pitch));drag={x:e.clientX,y:e.clientY};draw();});
cv.addEventListener('pointerup',()=>{if(drag){drag=null;cv.classList.remove('drag');draw();}});
cv.addEventListener('pointercancel',()=>{drag=null;cv.classList.remove('drag');});
cv.addEventListener('wheel',e=>{e.preventDefault();zoom*=e.deltaY<0?1.12:0.89;zoom=Math.max(0.3,Math.min(8,zoom));draw();},{passive:false});
document.getElementById('mode').onclick=()=>{mode=mode==='depth'?'intensity':'depth';document.getElementById('modeLbl').textContent='Color: '+(mode==='intensity'?'photo':'depth');buildBins();draw();};
document.getElementById('traj').onclick=e=>{showTraj=!showTraj;e.currentTarget.style.opacity=showTraj?1:.5;draw();};
document.getElementById('reset').onclick=()=>{yaw=0.7;pitch=-0.35;zoom=1;draw();};
document.getElementById('psz').oninput=e=>{ps=parseFloat(e.target.value);draw();};
function tick(){if(!drag&&!reduce){idle++;if(idle>110){yaw+=0.0014;draw();}}requestAnimationFrame(tick);}
['pointerdown','wheel'].forEach(ev=>cv.addEventListener(ev,()=>idle=0));
// ---- panels ----
document.getElementById('prov').textContent='OV9281 stereo · self-cal (still-fit) · Pi 5 · 2026-08-04';
document.getElementById('npts').textContent=S.n_pts.toLocaleString();
document.getElementById('track').innerHTML=(100*(S.n_frames-S.fails)/S.n_frames).toFixed(0)+'<small>% frames tracked</small>';
document.getElementById('trackcap').textContent=`only ${S.fails} / ${S.n_frames} frames dropped — clean continuous stereo tracking`;
document.getElementById('cells').innerHTML=[
  ['Cloud points',S.n_pts.toLocaleString()],
  ['Keyframes',S.n_kf],
  ['Front-end',S.fps+'<small> fps</small>'],
  ['Path length',S.pathlen_m+'<small> m</small>'],
].map(c=>`<div class="cell"><div class="k">${c[0]}</div><div class="v">${c[1]}</div></div>`).join('');
document.getElementById('note').innerHTML='<b>What you’re seeing:</b> a room reconstructed from the OV9281 global-shutter stereo pair on the Pi 5. In <b>photo</b> mode each 3D point carries its real image brightness — the OV9281 is a mono camera, so the “colour” is the actual grayscale. Compare it to the real camera frames below. The cyan line is the camera path; amber dots are keyframes.';
document.getElementById('frames').innerHTML=(DATA.frames||[]).map(f=>`<img src="${f}" alt="OV9281 frame" style="width:100%;aspect-ratio:5/4;object-fit:cover;border-radius:5px;border:1px solid var(--line);display:block">`).join('');
document.getElementById('method').innerHTML='<b>Method.</b> ORB-SLAM3 stereo (headless) on Raspberry Pi 5, OV9281 pair rectified with a <b>still-frame self-calibration</b> (fit from the stationary part of the clip — <code>2.41°</code> rig geometry, sub-pixel). Point cloud = per-keyframe SGBM disparity → 3D → transformed by keyframe pose. Handheld, cardboard mount, jerky motion — a proper rigid mount + recalibration will tighten it. All figures measured on-bench.';
