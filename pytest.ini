[pytest]
# Two services (garuda-configd, garuda-follow) each ship a `tests/__init__.py`
# marker, so pytest's default "prepend" import mode resolves both to the
# same top-level module name `tests` when collected in one session — whichever
# loads first wins that name, and the other service's test files then fail
# with "ModuleNotFoundError: No module named 'tests.test_X'" (pre-existing
# layout collision, only surfaced once `pytest services/ -v` runs across all
# services together). --import-mode=importlib resolves each test file by its
# file path instead of a dotted package name, so no rename/dedup is needed.
addopts = --import-mode=importlib
