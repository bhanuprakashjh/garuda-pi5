# meta-garuda — Garuda SDK layer for the Hailo-15 product tier.
# NOT built on the bench; recipes accrete here as dependencies land (CLAUDE.md §6 rule 6).
# LAYERSERIES_COMPAT is a placeholder — pin to whatever Yocto release Hailo OS is
# actually on at port time (Phase 9); do not port twice.

BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-garuda"
BBFILE_PATTERN_meta-garuda = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-garuda = "6"

LAYERSERIES_COMPAT_meta-garuda = "scarthgap"
